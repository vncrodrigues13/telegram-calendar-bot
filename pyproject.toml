[project]
name = "event-bot"
version = "0.1.0"
description = "Telegram to Google Calendar event bot"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=22.8",
    "pydantic>=2.10",
    "pydantic-settings>=2.15",
    "google-genai>=2.17",
    "google-api-python-client>=2.198",
    "google-auth-oauthlib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
